<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulatore Casi Clinici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="marchio">
        <span class="marchio-icona">🩺</span>
        <div>
          <h1>Simulatore Casi Clinici</h1>
          <p class="sottotitolo">Scegli una materia per iniziare</p>
        </div>
      </div>
      <nav class="top-nav">
        <a href="index.html" class="attivo">Home</a>
        <a href="ripassa.html">Ripassa</a>
        <a href="casi.html">I miei casi</a>
        <a href="aggiungi.html">+ Aggiungi</a>
      </nav>
    </div>
  </header>

  <main>
    <h2 class="page-title">Le tue materie</h2>
    <p class="page-sub">Scegli una materia da ripassare, o esercitati su tutte insieme.</p>
    <p id="stato-home" class="muted">Caricamento materie...</p>
    <div id="materie" class="materie-grid" hidden></div>
  </main>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('stato-home');
      if (el) el.textContent = 'Errore nella pagina: ' + (e.message || 'sconosciuto');
    });
  </script>
  <script type="module" src="home.js?v=2"></script>
</body>
</html>
