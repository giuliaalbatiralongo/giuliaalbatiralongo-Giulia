<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi caso — Simulatore Casi Clinici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="marchio">
        <span class="marchio-icona">🩺</span>
        <div>
          <h1>Simulatore Casi Clinici</h1>
          <p class="sottotitolo">Aggiungi un nuovo caso</p>
        </div>
      </div>
      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="ripassa.html">Ripassa</a>
        <a href="casi.html">I miei casi</a>
        <a href="materiali.html">Materiali</a>
        <a href="aggiungi.html" class="attivo">+ Aggiungi</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenuto-stretto">
      <h2 class="page-title">Aggiungi un nuovo caso</h2>
      <p class="page-sub">Compila tutti i campi: il caso entrerà subito nel ripasso con stato "nuovo".</p>

      <form id="form-caso">
        <label for="materia">Materia</label>
        <input type="text" id="materia" name="materia" list="materie-suggerite" required>
        <datalist id="materie-suggerite">
          <option value="Farmacologia 2">
          <option value="Gastroenterologia">
          <option value="Malattie Infettive">
          <option value="Anatomia Patologica">
          <option value="Organi di Senso">
        </datalist>

        <label for="argomento">Argomento <span class="opzionale">(facoltativo)</span></label>
        <input type="text" id="argomento" name="argomento" placeholder="Es. Anticoagulanti, Interazioni farmacologiche...">

        <label for="vignetta">Vignetta clinica</label>
        <textarea id="vignetta" name="vignetta" rows="4" required></textarea>

        <label for="domanda">Domanda</label>
        <textarea id="domanda" name="domanda" rows="2" required></textarea>

        <p class="hint">Scrivi le 4 opzioni e segna con il pallino quale è quella corretta.</p>

        <div class="opzione-form">
          <label><input type="radio" name="corretta" value="a" required> Corretta</label>
          <input type="text" name="opzione_a" placeholder="Opzione A" required>
        </div>
        <div class="opzione-form">
          <label><input type="radio" name="corretta" value="b"> Corretta</label>
          <input type="text" name="opzione_b" placeholder="Opzione B" required>
        </div>
        <div class="opzione-form">
          <label><input type="radio" name="corretta" value="c"> Corretta</label>
          <input type="text" name="opzione_c" placeholder="Opzione C" required>
        </div>
        <div class="opzione-form">
          <label><input type="radio" name="corretta" value="d"> Corretta</label>
          <input type="text" name="opzione_d" placeholder="Opzione D" required>
        </div>

        <label for="spiegazione">Spiegazione</label>
        <textarea id="spiegazione" name="spiegazione" rows="3" required></textarea>

        <button type="submit">Salva caso</button>
      </form>

      <p id="esito-salvataggio"></p>
    </div>
  </main>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('esito-salvataggio');
      if (el) el.textContent = 'Errore nella pagina: ' + (e.message || 'sconosciuto');
    });
  </script>
  <script type="module" src="aggiungi.js?v=4"></script>
</body>
</html>
