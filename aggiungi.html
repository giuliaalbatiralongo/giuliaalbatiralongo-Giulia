<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi caso - Akesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">AKESIS</div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-voce"><i class="ph ph-house" aria-hidden="true"></i><span>Home</span></a>
        <a href="quiz.html" class="nav-voce attivo"><i class="ph-fill ph-cards" aria-hidden="true"></i><span>Quiz</span></a>
        <a href="domande.html" class="nav-voce"><i class="ph ph-exam" aria-hidden="true"></i><span>Domande esami</span></a>
        <a href="materiali.html" class="nav-voce"><i class="ph ph-folder" aria-hidden="true"></i><span>Materiali</span></a>
      </nav>

      <div class="sidebar-fondo">
        <button class="profilo-btn" type="button" disabled aria-disabled="true">
          <span class="profilo-avatar"><i class="ph ph-user" aria-hidden="true"></i></span>
          <span class="profilo-testo">
            <span class="profilo-nome">Profilo</span>
            <span class="profilo-nota">Presto disponibile</span>
          </span>
        </button>
      </div>
    </aside>

    <main class="contenuto">
      <div class="contenuto-interno">
        <div class="testata">
          <div>
            <h1 class="page-titolo">Aggiungi caso</h1>
            <p class="page-sub">Il caso entra subito nel quiz con stato nuovo.</p>
          </div>
          <a href="quiz.html" class="link-testo"><i class="ph ph-arrow-left" aria-hidden="true"></i> Torna al quiz</a>
        </div>

        <form id="form-caso" class="form">
          <div class="campo">
            <label for="materia">Materia</label>
            <input type="text" id="materia" name="materia" list="materie-suggerite" required>
            <datalist id="materie-suggerite">
              <option value="Farmacologia 2">
              <option value="Gastroenterologia">
              <option value="Malattie Infettive">
              <option value="Anatomia Patologica">
              <option value="Organi di Senso">
            </datalist>
          </div>

          <div class="campo">
            <label for="argomento">Argomento <span class="campo-nota">facoltativo</span></label>
            <input type="text" id="argomento" name="argomento" placeholder="Es. Anticoagulanti">
          </div>

          <div class="campo">
            <label for="vignetta">Vignetta clinica</label>
            <textarea id="vignetta" name="vignetta" rows="5" required></textarea>
          </div>

          <div class="campo">
            <label for="domanda">Domanda</label>
            <textarea id="domanda" name="domanda" rows="2" required></textarea>
          </div>

          <div class="gruppo-opzioni">
            <p class="gruppo-opzioni-nota">Compila le quattro opzioni e seleziona quella corretta.</p>

            <div class="riga-opzione">
              <label for="opzione_a"><input type="radio" name="corretta" value="a" required> Opzione A</label>
              <input type="text" id="opzione_a" name="opzione_a" required>
            </div>
            <div class="riga-opzione">
              <label for="opzione_b"><input type="radio" name="corretta" value="b"> Opzione B</label>
              <input type="text" id="opzione_b" name="opzione_b" required>
            </div>
            <div class="riga-opzione">
              <label for="opzione_c"><input type="radio" name="corretta" value="c"> Opzione C</label>
              <input type="text" id="opzione_c" name="opzione_c" required>
            </div>
            <div class="riga-opzione">
              <label for="opzione_d"><input type="radio" name="corretta" value="d"> Opzione D</label>
              <input type="text" id="opzione_d" name="opzione_d" required>
            </div>
          </div>

          <div class="campo">
            <label for="spiegazione">Spiegazione</label>
            <textarea id="spiegazione" name="spiegazione" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn" style="align-self: flex-start">
            <i class="ph ph-check" aria-hidden="true"></i> Salva caso
          </button>
        </form>

        <p id="esito" class="esito-form"></p>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('esito');
      if (el) el.textContent = 'Errore nella pagina: ' + (e.message || 'sconosciuto');
    });
  </script>
  <script type="module" src="aggiungi.js?v=9"></script>
</body>
</html>
