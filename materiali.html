<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiali - Akesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">AKESIS</div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-voce"><i class="ph ph-house" aria-hidden="true"></i><span>Home</span></a>
        <a href="ripassa.html" class="nav-voce"><i class="ph ph-cards" aria-hidden="true"></i><span>Ripassa</span></a>
        <a href="casi.html" class="nav-voce"><i class="ph ph-list-checks" aria-hidden="true"></i><span>I miei casi</span></a>
        <a href="materiali.html" class="nav-voce attivo"><i class="ph-fill ph-folder" aria-hidden="true"></i><span>Materiali</span></a>
        <a href="aggiungi.html" class="nav-voce"><i class="ph ph-plus-circle" aria-hidden="true"></i><span>Aggiungi</span></a>
      </nav>

      <div class="sidebar-fondo">
        <button class="profilo-btn" type="button" disabled aria-disabled="true">
          <span class="profilo-avatar"><i class="ph ph-user" aria-hidden="true"></i></span>
          <span class="profilo-testo">
            <span class="profilo-nome">Profilo</span>
            <span class="profilo-nota">Presto disponibile</span>
          </span>
        </button>
      </div>
    </aside>

    <main class="contenuto">
      <div class="contenuto-interno">
        <div class="testata">
          <div>
            <h1 class="page-titolo">Materiali di studio</h1>
            <p class="page-sub">Dispense e documenti collegati alle tue materie.</p>
          </div>
          <a href="carica-materiale.html" class="btn"><i class="ph ph-upload-simple" aria-hidden="true"></i> Carica materiale</a>
        </div>

        <div id="scheletro">
          <div class="scheletro scheletro-riga" style="width: 180px"></div>
          <div class="scheletro scheletro-card"></div>
        </div>

        <div id="materiali"></div>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('scheletro');
      if (el) el.innerHTML = '<p class="messaggio-errore">Errore nella pagina: ' + (e.message || 'sconosciuto') + '</p>';
    });
  </script>
  <script type="module" src="materiali.js?v=3"></script>
</body>
</html>
