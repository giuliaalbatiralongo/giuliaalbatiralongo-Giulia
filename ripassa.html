<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripassa — Simulatore Casi Clinici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="marchio">
        <span class="marchio-icona">🩺</span>
        <div>
          <h1>Simulatore Casi Clinici</h1>
          <p class="sottotitolo">Ripassa</p>
        </div>
      </div>
      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="ripassa.html" class="attivo">Ripassa</a>
        <a href="casi.html">I miei casi</a>
        <a href="materiali.html">Materiali</a>
        <a href="aggiungi.html">+ Aggiungi</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="contenuto-stretto">
      <div class="ripassa-header">
        <span id="titolo-materia" class="page-title">Ripassa</span>
        <a href="index.html" class="link-cambia">← Cambia materia</a>
      </div>

      <p id="caricamento">Caricamento caso dal database...</p>

      <section id="caso" hidden>
        <div class="card-caso">
          <p class="materia-label" id="materia-label"></p>
          <p id="vignetta-text"></p>
          <p id="domanda-text" class="domanda"></p>

          <div id="opzioni"></div>
        </div>

        <div id="risultato" hidden></div>

        <button id="prossimo" hidden>Prossimo caso →</button>
      </section>
    </div>
  </main>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('caricamento');
      if (el) el.textContent = 'Errore nella pagina: ' + (e.message || 'sconosciuto');
    });
  </script>
  <script type="module" src="ripassa.js?v=3"></script>
</body>
</html>
