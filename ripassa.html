<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripassa — Simulatore Casi Clinici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="marchio">
        <i class="ph ph-stethoscope marchio-icona" aria-hidden="true"></i>
        <div>
          <h1>Simulatore Casi Clinici</h1>
          <p class="sottotitolo">Ripassa</p>
        </div>
      </div>
      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="ripassa.html" class="attivo">Ripassa</a>
        <a href="casi.html">I miei casi</a>
        <a href="materiali.html">Materiali</a>
        <a href="aggiungi.html">Aggiungi</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="ripassa-layout">
      <div class="ripassa-principale">
        <div class="ripassa-header">
          <h2 id="titolo-materia" class="page-title">Ripassa</h2>
          <a href="index.html" class="link-cambia">
            <i class="ph ph-arrow-left" aria-hidden="true"></i> Cambia materia
          </a>
        </div>

        <div id="scheletro-caso">
          <div class="scheletro scheletro-card"></div>
        </div>

        <section id="caso" hidden>
          <div class="card-caso">
            <p class="materia-label" id="materia-label"></p>
            <p id="vignetta-text"></p>
            <p id="domanda-text" class="domanda"></p>

            <div id="opzioni"></div>
          </div>

          <div id="risultato" hidden></div>

          <button id="prossimo" hidden>
            Prossimo caso <i class="ph ph-arrow-right" aria-hidden="true"></i>
          </button>
        </section>
      </div>

      <aside class="materiali-laterali" id="materiali-laterali" hidden>
        <h3>Materiali correlati</h3>
        <ul id="materiali-laterali-lista"></ul>
      </aside>
    </div>
  </main>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('scheletro-caso');
      if (el) el.innerHTML = '<p class="errore">Errore nella pagina: ' + (e.message || 'sconosciuto') + '</p>';
    });
  </script>
  <script type="module" src="ripassa.js?v=5"></script>
</body>
</html>
