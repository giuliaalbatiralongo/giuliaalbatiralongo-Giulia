<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi domanda - Akesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra">
      <div class="sidebar-testa">
        <div class="logo">AKESIS</div>
        <button type="button" class="btn-barra" id="chiudi-barra"
                aria-label="Nascondi il menu" aria-controls="barra" aria-expanded="true">
          <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-gruppo">Studio</p>
        <a href="index.html" class="nav-voce"><i class="ph ph-house" aria-hidden="true"></i><span>Home</span></a>
        <a href="quiz.html" class="nav-voce"><i class="ph ph-cards" aria-hidden="true"></i><span>Quiz</span></a>
        <a href="domande.html" class="nav-voce attivo"><i class="ph-fill ph-exam" aria-hidden="true"></i><span>Domande esami</span></a>
        <a href="ssm.html" class="nav-voce"><i class="ph ph-target" aria-hidden="true"></i><span>Test SSM</span></a>
        <a href="materiali.html" class="nav-voce"><i class="ph ph-folder" aria-hidden="true"></i><span>Materiali</span></a>
        <p class="nav-gruppo" data-solo-admin hidden>Gestione</p>
        <a href="revisione.html" class="nav-voce" data-solo-admin hidden><i class="ph ph-seal-check" aria-hidden="true"></i><span>Revisione</span></a>
      </nav>

      <div class="sidebar-fondo">
        <button class="profilo-btn" type="button" disabled aria-disabled="true">
          <span class="profilo-avatar"><i class="ph ph-user" aria-hidden="true"></i></span>
          <span class="profilo-testo">
            <span class="profilo-nome">Profilo</span>
            <span class="profilo-nota">Presto disponibile</span>
          </span>
        </button>
      </div>
    </aside>

    <button type="button" class="btn-barra btn-barra-fuori" id="apri-barra" hidden
            aria-label="Mostra il menu" aria-controls="barra" aria-expanded="false">
      <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
    </button>

    <main class="contenuto">
      <div class="contenuto-interno">
        <div class="testata">
          <div>
            <h1 class="page-titolo">Aggiungi una domanda d'esame</h1>
            <p class="page-sub">Parte da una segnalazione. Ogni volta che la ritrovi, aggiungi una tacca dall'elenco.</p>
          </div>
          <a href="domande.html" class="link-testo"><i class="ph ph-arrow-left" aria-hidden="true"></i> Torna all'elenco</a>
        </div>

        <form id="form-domanda" class="form">
          <div class="campo">
            <label for="materia">Materia</label>
            <input type="text" id="materia" name="materia" list="materie-suggerite" required>
            <datalist id="materie-suggerite">
              <option value="Farmacologia 2">
              <option value="Gastroenterologia">
              <option value="Malattie Infettive">
              <option value="Anatomia Patologica">
              <option value="Organi di Senso">
            </datalist>
          </div>

          <div class="campo">
            <label for="argomento">Argomento <span class="campo-nota">facoltativo</span></label>
            <input type="text" id="argomento" name="argomento" placeholder="Es. Anticoagulanti">
          </div>

          <div class="campo">
            <label for="domanda">Domanda</label>
            <textarea id="domanda" name="domanda" rows="3" required placeholder="Come l'ha posta il professore"></textarea>
          </div>

          <div class="campo">
            <label for="note">Note <span class="campo-nota">facoltativo</span></label>
            <textarea id="note" name="note" rows="3" placeholder="Cosa chiede di preciso, come rispondere, riferimenti"></textarea>
          </div>

          <button type="submit" class="btn" style="align-self: flex-start">
            <i class="ph ph-check" aria-hidden="true"></i> Salva domanda
          </button>
        </form>

        <p id="esito" class="esito-form"></p>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('esito');
      if (el) el.textContent = 'Errore nella pagina: ' + (e.message || 'sconosciuto');
    });
  </script>
  <script type="module" src="aggiungi-domanda.js?v=5"></script>
</body>
</html>
