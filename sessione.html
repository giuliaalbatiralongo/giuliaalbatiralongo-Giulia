<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessione - Akesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=37">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="barra">
      <div class="sidebar-testa">
        <div class="logo">AKESIS</div>
        <button type="button" class="btn-barra" id="chiudi-barra"
                aria-label="Nascondi il menu" aria-controls="barra" aria-expanded="true">
          <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-gruppo">Studio</p>
        <a href="index.html" class="nav-voce"><i class="ph ph-house" aria-hidden="true"></i><span>Home</span></a>
        <a href="calendario.html" class="nav-voce"><i class="ph ph-calendar-dots" aria-hidden="true"></i><span>Calendario</span></a>
        <a href="piano.html" class="nav-voce"><i class="ph ph-path" aria-hidden="true"></i><span>Organizzazione studio</span></a>
        <a href="quiz.html" class="nav-voce attivo"><i class="ph-fill ph-cards" aria-hidden="true"></i><span>Quiz</span></a>
        <a href="domande.html" class="nav-voce"><i class="ph ph-exam" aria-hidden="true"></i><span>Domande esami</span></a>
        <a href="ssm.html" class="nav-voce"><i class="ph ph-target" aria-hidden="true"></i><span>Test SSM</span></a>
        <a href="statistiche.html" class="nav-voce"><i class="ph ph-chart-line" aria-hidden="true"></i><span>Statistiche</span></a>
        <a href="materiali.html" class="nav-voce"><i class="ph ph-folder" aria-hidden="true"></i><span>Materiali</span></a>
        <p class="nav-gruppo" data-solo-admin hidden>Gestione</p>
        <a href="revisione.html" class="nav-voce" data-solo-admin hidden><i class="ph ph-seal-check" aria-hidden="true"></i><span>Revisione</span></a>

        <p class="nav-gruppo">Altro</p>
        <a href="servizi.html" class="nav-voce"><i class="ph ph-handshake" aria-hidden="true"></i><span>Servizi</span></a>
      </nav>

      <div class="sidebar-fondo">
        <button class="profilo-btn" type="button" disabled aria-disabled="true">
          <span class="profilo-avatar"><i class="ph ph-user" aria-hidden="true"></i></span>
          <span class="profilo-testo">
            <span class="profilo-nome">Profilo</span>
            <span class="profilo-nota">Presto disponibile</span>
          </span>
        </button>
      </div>
    </aside>

    <button type="button" class="btn-barra btn-barra-fuori" id="apri-barra" hidden
            aria-label="Mostra il menu" aria-controls="barra" aria-expanded="false">
      <i class="ph ph-sidebar-simple" aria-hidden="true"></i>
    </button>

    <main class="contenuto">
      <div class="contenuto-interno">
        <div class="testata">
          <div>
            <h1 class="page-titolo" id="titolo-materia">Sessione</h1>
            <p class="page-sub" id="riepilogo-sessione">Priorità ai casi non ancora consolidati.</p>
          </div>
          <a href="quiz.html" class="link-testo"><i class="ph ph-arrow-left" aria-hidden="true"></i> Torna al quiz</a>
        </div>

        <div class="ripassa-layout">
          <div class="ripassa-principale">
            <div id="scheletro">
              <div class="scheletro scheletro-card"></div>
            </div>

            <section id="caso" hidden>
              <article class="card-caso">
                <p class="caso-materia" id="caso-materia"></p>
                <p class="caso-vignetta" id="caso-vignetta"></p>
                <p class="caso-domanda" id="caso-domanda"></p>
                <div id="opzioni"></div>
              </article>

              <div id="risultato" hidden></div>

              <button id="prossimo" class="btn btn-largo" hidden>
                Prossimo caso <i class="ph ph-arrow-right" aria-hidden="true"></i>
              </button>
            </section>
          </div>

          <aside class="pannello" id="materiali-laterali" hidden>
            <h3>Materiali correlati</h3>
            <ul id="materiali-laterali-lista"></ul>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('scheletro');
      if (el) el.innerHTML = '<p class="messaggio-errore">Errore nella pagina: ' + (e.message || 'sconosciuto') + '</p>';
    });
  </script>
  <script type="module" src="sessione.js?v=10"></script>
</body>
</html>
